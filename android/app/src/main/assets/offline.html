<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AmoreChat</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: #0b0e1a; color: #e6e8f5;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; text-align: center; }
  .box { max-width: 340px; }
  .icon { font-size: 52px; }
  p { color: #8f97b8; line-height: 1.8; }
  button { width: 100%; margin-top: 10px; padding: 13px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #6366f1, #8b5cf6); }
  button.alt { background: #1b2138; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">📡</div>
  <h2>به سرور وصل نشد</h2>
  <p>اینترنت یا اتصال به سرور قطع است. خودکار دوباره تلاش می‌کنیم.</p>
  <button onclick="AmoreAndroid.reload()">تلاش دوباره</button>
  <button class="alt" onclick="AmoreAndroid.changeServer()">تغییر آدرس سرور</button>
</div>
<script>
  setTimeout(() => AmoreAndroid.reload(), 8000);
</script>
</body>
</html>
