name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npm run build
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/hs PORT=3100 SWEEP_MS=500 node server/src/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3100/healthz && break; sleep 1; done
          CODE=$(grep -oP 'SETUP CODE: \K\S+' server.log)
          SWEEP_MS=500 node server/test/smoke.mjs http://localhost:3100 "$CODE"
      - name: Voice/call API test
        run: |
          export LIVEKIT_API_KEY=amorechat LIVEKIT_API_SECRET=ci-secret-0123456789abcdefghijklmnopqrstuv LIVEKIT_URL=http://127.0.0.1:7999
          DATA_DIR=/tmp/hs-rtc PORT=3102 node server/src/index.js > server-rtc.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3102/healthz && break; sleep 1; done
          CODE=$(grep -oP 'SETUP CODE: \K\S+' server-rtc.log)
          LK_SECRET=$LIVEKIT_API_SECRET node server/test/rtc-api.mjs http://localhost:3102 "$CODE"
      - name: Server logs
        if: always()
        run: cat server.log server-rtc.log

  # Real LiveKit + two headless Chromes with fake microphone/camera.
  rtc-e2e:
    runs-on: ubuntu-latest
    env:
      LIVEKIT_API_KEY: amorechat
      LIVEKIT_API_SECRET: ci-secret-0123456789abcdefghijklmnopqrstuv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start LiveKit (the production config, webhook pointed at this runner)
        run: |
          sed 's#http://app:3000#http://127.0.0.1:3101#' deploy/livekit.yaml > /tmp/livekit.yaml
          docker run -d --name livekit --network host \
            -v /tmp/livekit.yaml:/etc/livekit.yaml:ro \
            -e "LIVEKIT_KEYS=amorechat: $LIVEKIT_API_SECRET" \
            livekit/livekit-server:v1.13.7 --config /etc/livekit.yaml --node-ip 127.0.0.1
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7880 && break; sleep 1; done
      - name: Start app
        run: |
          LIVEKIT_URL=http://127.0.0.1:7880 DATA_DIR=/tmp/e2e PORT=3101 node server/src/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3101/healthz && break; sleep 1; done
      - name: Install headless Chrome
        run: npm install --no-save puppeteer@25.11.0
      - name: End-to-end voice/video test
        run: |
          CODE=$(grep -oP 'SETUP CODE: \K\S+' server.log)
          node server/test/rtc-e2e.mjs http://localhost:3101 "$CODE"
      - name: Logs
        if: always()
        run: |
          cat server.log
          docker logs livekit 2>&1 | tail -80
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: e2e-fail-*.png
