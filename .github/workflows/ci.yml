name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npm run build
      - name: /ca page fingerprint
        run: node server/test/ca-fingerprint.mjs
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/hs PORT=3100 SWEEP_MS=500 node server/src/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3100/healthz && break; sleep 1; done
          CODE=$(grep -oP 'SETUP CODE: \K\S+' server.log)
          SWEEP_MS=500 node server/test/smoke.mjs http://localhost:3100 "$CODE"
      - name: Voice/call API test
        run: |
          export LIVEKIT_API_KEY=amorechat LIVEKIT_API_SECRET=ci-secret-0123456789abcdefghijklmnopqrstuv LIVEKIT_URL=http://127.0.0.1:7999
          DATA_DIR=/tmp/hs-rtc PORT=3102 node server/src/index.js > server-rtc.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3102/healthz && break; sleep 1; done
          CODE=$(grep -oP 'SETUP CODE: \K\S+' server-rtc.log)
          LK_SECRET=$LIVEKIT_API_SECRET node server/test/rtc-api.mjs http://localhost:3102 "$CODE"
      - name: Account & security test
        run: |
          DATA_DIR=/tmp/hs-acc PORT=3104 node server/src/index.js > server-acc.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3104/healthz && break; sleep 1; done
          CODE=$(grep -oP 'SETUP CODE: \K\S+' server-acc.log)
          node server/test/account.mjs http://127.0.0.1:3104 "$CODE"
      - name: Server logs
        if: always()
        run: cat server.log server-rtc.log server-acc.log

  # The production docker-compose stack (app + LiveKit + Caddy), wired the way install.sh does it.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare like install.sh
        run: |
          # Offline mode on a bare IP: the server's own CA, no Let's Encrypt.
          printf 'DOMAIN=127.0.0.1\nTLS_MODE=internal\nBACKUP_KEEP=14\nLOG_LEVEL=info\n' > .env
          cp deploy/Caddyfile Caddyfile
          mkdir -p data certs && sudo chown -R 1000:1000 data
          sudo bash deploy/ensure-env.sh
          grep -E '^(PUBLIC_IP|LIVEKIT_API_SECRET)=.' .env | sed 's/=.*/=<set>/'
      - name: Start the stack
        run: docker compose up -d --build
      - name: Check site, media server and the /rtc proxy
        run: |
          set -x
          for i in $(seq 1 60); do curl -skf https://127.0.0.1/healthz && break; sleep 2; done
          # A device that installed the CA from http://<ip>/ca.crt trusts the site with full verification.
          curl -sf http://127.0.0.1/ca.crt -o /tmp/ca.crt && grep -q 'BEGIN CERTIFICATE' /tmp/ca.crt
          curl -sf --cacert /tmp/ca.crt https://127.0.0.1/api/config | grep -q '"rtc":true'
          curl -sf http://127.0.0.1/ca | grep -q 'نصب گواهی'
          # Everything else on plain HTTP is redirected to HTTPS.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/)" = "301" ]
          # LiveKit answers through the app's /rtc proxy (401 = reached it, token missing).
          code=$(curl -s --cacert /tmp/ca.crt -o /dev/null -w '%{http_code}' https://127.0.0.1/rtc/validate)
          echo "rtc/validate -> $code"; [ "$code" = "401" ]
          docker compose logs livekit | grep -q 'starting LiveKit server'
          ! docker compose logs livekit | grep -i 'secret is too short'
      - name: Android app through Caddy (download page over HTTP, notification stream not buffered)
        run: |
          set -x
          curl -sf http://127.0.0.1/app | grep -q 'اندروید'
          CODE=$(docker compose logs app | grep -oP 'SETUP CODE: \K\S+' | tail -1)
          curl -sf --cacert /tmp/ca.crt -c /tmp/jar -H 'x-requested-with: amorechat' -H 'content-type: application/json' \
            -d "{\"username\":\"owner\",\"password\":\"Str0ng-Pass-77\",\"displayName\":\"O\",\"invite\":\"$CODE\"}" https://127.0.0.1/api/auth/register > /dev/null
          # The first bytes must arrive at once (compression must not hold them back).
          curl -sN --compressed --cacert /tmp/ca.crt -b /tmp/jar --max-time 5 https://127.0.0.1/api/notify/stream > /tmp/sse.txt || true
          cat /tmp/sse.txt
          grep -q 'connected' /tmp/sse.txt
          # Health dashboard sees the whole server's traffic (host counters mounted read-only).
          curl -sf --cacert /tmp/ca.crt -b /tmp/jar https://127.0.0.1/api/admin/health | tee /tmp/health.json | head -c 400; echo
          grep -q '"netHostWide":true' /tmp/health.json
      - name: Offline update from a folder (no GitHub)
        run: |
          set -x -o pipefail
          mkdir -p /tmp/rel
          git archive --format=tar.gz --prefix=amorechat/ -o /tmp/rel/amorechat-source.tar.gz HEAD
          sudo FORCE=1 bash deploy/update.sh /tmp/rel 2>&1 | tee /tmp/update.log
          grep -q 'is running' /tmp/update.log
          for i in $(seq 1 60); do curl -sf --cacert /tmp/ca.crt https://127.0.0.1/healthz && break; sleep 2; done
          curl -sf --cacert /tmp/ca.crt https://127.0.0.1/api/config | grep -q '"version"'
      - name: Logs
        if: always()
        run: |
          curl -vsk https://127.0.0.1/healthz 2>&1 | tail -25 || true
          curl -vs http://127.0.0.1/ca.crt 2>&1 | tail -15 || true
          docker compose logs caddy --tail 80
          docker compose logs --tail 30

  # Real LiveKit + two headless Chromes with fake microphone/camera.
  rtc-e2e:
    runs-on: ubuntu-latest
    env:
      LIVEKIT_API_KEY: amorechat
      LIVEKIT_API_SECRET: ci-secret-0123456789abcdefghijklmnopqrstuv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start LiveKit (the production config, webhook pointed at this runner)
        run: |
          sed 's#http://app:3000#http://127.0.0.1:3101#' deploy/livekit.yaml > /tmp/livekit.yaml
          docker run -d --name livekit --network host \
            -v /tmp/livekit.yaml:/etc/livekit.yaml:ro \
            -e "LIVEKIT_KEYS=amorechat: $LIVEKIT_API_SECRET" \
            livekit/livekit-server:v1.13.7 --config /etc/livekit.yaml --node-ip 127.0.0.1
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7880 && break; sleep 1; done
      - name: Start app
        run: |
          LIVEKIT_URL=http://127.0.0.1:7880 DATA_DIR=/tmp/e2e PORT=3101 node server/src/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3101/healthz && break; sleep 1; done
      - name: Install headless Chrome and a portrait fake camera
        run: |
          npm install --no-save puppeteer@25.11.0
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -loglevel error -f lavfi -i testsrc=size=360x640:rate=15 -t 4 -pix_fmt yuv420p /tmp/portrait.y4m
      - name: End-to-end voice/video test
        run: |
          CODE=$(grep -oP 'SETUP CODE: \K\S+' server.log)
          FAKE_VIDEO=/tmp/portrait.y4m node server/test/rtc-e2e.mjs http://localhost:3101 "$CODE"
      - name: UI test (menus, dialogs, step-by-step Back; desktop and phone size)
        run: |
          mkdir -p /tmp/apk && head -c 300000 /dev/urandom > /tmp/apk/amorechat.apk
          APK_DIR=/tmp/apk DATA_DIR=/tmp/ui PORT=3102 node server/src/index.js > ui-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3102/healthz && break; sleep 1; done
          CODE=$(grep -oP 'SETUP CODE: \K\S+' ui-server.log)
          APK_DIR=/tmp/apk node server/test/ui-e2e.mjs http://localhost:3102 "$CODE"
      - name: Logs
        if: always()
        run: |
          cat server.log
          docker logs livekit 2>&1 | tail -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: |
            e2e-fail-*.png
            shot-*.png
            ui-fail-*.png

  # A full international shutdown: the stack and a Chrome client on a Docker network with
  # NO route to the internet; the complete end-to-end suite runs inside it.
  isolated:
    runs-on: ubuntu-latest
    env:
      DC: docker compose -p iso -f docker-compose.yml -f docker-compose.isolated.yml
    steps:
      - uses: actions/checkout@v4
      - name: Prepare like install.sh (offline mode on a domain)
        run: |
          printf 'DOMAIN=chat.test\nTLS_MODE=internal\nPUBLIC_IP=172.30.0.10\nBACKUP_KEEP=14\nLOG_LEVEL=info\n' > .env
          cp deploy/Caddyfile Caddyfile
          mkdir -p data certs && sudo chown -R 1000:1000 data
          sudo bash deploy/ensure-env.sh
      - name: Build and pull everything while the runner still has internet
        run: |
          $DC build
          $DC pull caddy livekit
          docker build -t amorechat-e2e -f server/test/Dockerfile.e2e .
      - name: Start the stack with no internet
        run: |
          $DC up -d
          [ "$(docker network inspect iso_default --format '{{.Internal}}')" = "true" ]
      - name: Prove there is no internet (server and client)
        run: |
          set -x
          ! $DC exec -T app wget -q -T 8 -O /dev/null https://github.com
          ! $DC exec -T app wget -q -T 8 -O /dev/null http://1.1.1.1
          ! docker run --rm --network iso_default --entrypoint curl amorechat-e2e -sS -m 8 https://www.google.com
          ! docker run --rm --network iso_default --entrypoint curl amorechat-e2e -sS -m 8 http://8.8.8.8
      - name: Complete end-to-end test inside the isolated network
        run: |
          for i in $(seq 1 30); do $DC logs app | grep -q 'SETUP CODE' && break; sleep 2; done
          CODE=$($DC logs app | grep -oP 'SETUP CODE: \K\S+' | tail -1)
          docker run --name e2e --network iso_default amorechat-e2e https://chat.test "$CODE"
      - name: Logs
        if: always()
        run: |
          mkdir -p iso-out && docker cp e2e:/e2e/. iso-out/ 2>/dev/null || true
          $DC logs --tail 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-screenshots
          path: iso-out/*.png
