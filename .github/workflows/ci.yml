name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/hs PORT=3100 node server/src/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3100/healthz && break; sleep 1; done
          CODE=$(grep -oP 'SETUP CODE: \K\S+' server.log)
          node server/test/smoke.mjs http://localhost:3100 "$CODE"
