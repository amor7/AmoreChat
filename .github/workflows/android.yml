name: android
# Builds the Android app (debug for tests, signed release for the release job).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      ANDROID_KEYSTORE_B64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          APP_VERSION: ${{ inputs.version || '0.0.0' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android --no-daemon assembleDebug assembleRelease
      - name: Collect
        run: |
          mkdir -p android-dist
          cp android/app/build/outputs/apk/release/app-release*.apk android-dist/amorechat.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk android-dist/amorechat-debug.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs android-dist/amorechat.apk | head -5 || true
          ls -lh android-dist
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-dist/
